<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Контакты</title>
    <!-- Подключение внешней таблицы стилей -->
    <link href="css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
    <div id="content">
        <header>
            <div id="logo">
                <img src="img/logo.jpg" alt="Логотип">
            </div>
            <div id="name">
                <h1>ПУТЕШЕСТВУЙ С НАМИ!</h1>
            </div>
        </header>

        <nav>
            <a href="index.html">Главная страница</a>
            <a href="turs.html">Наши туры</a>
            <a href="contacts.html">О нас</a>
        </nav>

        <div id="main">
            <p>Наш адрес: г. Белогорск, ул. Ракетная, 18.</p>
            <p>Для связи с нами заполните форму:</p>
            
            <form method="get" action="#">
                <table id="form">
                    <tr>
                        <td>Введите свое имя</td>
                        <td><input name="name"></td>
                    </tr>
                    <tr>
                        <td>Введите ваш номер телефона</td>
                        <td><input name="tel"></td>
                    </tr>
                    <tr>
                        <td>Введите ваш электронный адрес</td>
                        <td><input name="mail"></td>
                    </tr>
                    <tr>
                        <td>Введите Ваше сообщение</td>
                        <td>
                            <textarea name="text" rows="3"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <input name="otp" type="submit" value="Отправить">
                        </td>
                    </tr>
                </table>
            </form>
        </div>

        <footer>
            Это сайт, предназначенный для обучения
        </footer>
    </div>
</body>
</html>
